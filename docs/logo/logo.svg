<!-- PLU Logo – Blau/Violett Version (passend zum Header & Hero Schema) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Hauptgradient: Blau -> Violett (wie Hero Text) -->
    <linearGradient id="pluGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#58a6ff"/> <!-- accent-primary Blau -->
      <stop offset="100%" stop-color="#8b5cf6"/> <!-- accent-violet -->
    </linearGradient>
    <!-- Alternativgradient: Violett -> Blau -->
    <linearGradient id="pluGradientAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46"
          fill="none" stroke="url(#pluGradient)" stroke-width="3" opacity="0.95"/>

  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="32"
          fill="none" stroke="#7c3aed" stroke-width="4" opacity="0.95"/>

  <!-- Stylized 'P' -->
  <path d="M38 28 L38 72 M38 28 L58 28 C68 28 68 46 58 46 L38 46"
        fill="none" stroke="url(#pluGradientAlt)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Orbital Dot -->
  <circle cx="78" cy="30" r="5" fill="#58a6ff"/>
</svg>
