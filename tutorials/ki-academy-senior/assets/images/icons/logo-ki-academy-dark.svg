<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kiGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D547"/>
      <stop offset="50%" style="stop-color:#F4A261"/>
      <stop offset="100%" style="stop-color:#90A955"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Ring (Orbit) - hellere Varianten für Dark Mode -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#kiGradientDark)" stroke-width="3" opacity="1"/>
  
  <!-- Inner Circle (Planet Core) -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#F5D547" stroke-width="4" opacity="0.9"/>
  
  <!-- P Letter (stylized) -->
  <path d="M38 28 L38 72 M38 28 L58 28 C68 28 68 46 58 46 L38 46" 
        fill="none" 
        stroke="url(#kiGradientDark)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Orbital Dot - Sage Grün für Kontrast im Dark Mode -->
  <circle cx="78" cy="30" r="5" fill="#90A955"/>
</svg>
