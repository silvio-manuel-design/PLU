<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seite nicht gefunden - Pansonic Lab">
  <meta name="theme-color" content="#ff5a5a">
  <title>404 - Seite nicht gefunden | Pansonic Lab</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style-v3.css">
  <style>
    .error-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 40px;
      text-align: center;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-coral), var(--accent-teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 24px;
    }
    
    .error-icon {
      font-size: 4rem;
      margin-bottom: 24px;
    }
    
    .error-title {
      font-size: 2rem;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    
    .error-message {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-coral), var(--accent-coral-dark));
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 90, 90, 0.3);
    }
    
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: var(--accent-coral);
    }
    
    .quick-links {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border-subtle);
    }
    
    .quick-links h3 {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .quick-links-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .quick-link {
      padding: 10px 18px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    
    .quick-link:hover {
      background: var(--bg-card);
      border-color: var(--accent-coral);
      color: var(--text-primary);
    }
    
    @media (max-width: 640px) {
      .error-code {
        font-size: 5rem;
      }
      
      .error-title {
        font-size: 1.5rem;
      }
      
      .error-actions {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }
      
      .btn-primary,
      .btn-secondary {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="header-logo">
        <div class="header-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <span class="header-logo-text">SONIC<span>LAB</span></span>
      </a>
    </div>
    
    <div class="header-right">
      <nav class="lang-switch" aria-label="Sprache wählen">
        <a href="404.html" class="lang-btn active" aria-current="page">DE</a>
        <a href="404-en.html" class="lang-btn">EN</a>
      </nav>
    </div>
  </header>

  <!-- Error Section -->
  <main class="error-section">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Seite nicht gefunden</h1>
    <p class="error-message">
      Die gesuchte Seite existiert nicht oder wurde verschoben. 
      Kehre zur Startseite zurück oder erkunde die Audio-Bibliothek.
    </p>
    
    <div class="error-actions">
      <a href="index.html" class="btn-primary">
        <span>🏠</span> Zur Startseite
      </a>
      <a href="bibliothek.html" class="btn-secondary">
        <span>🎵</span> Audio-Bibliothek
      </a>
    </div>
    
    <div class="quick-links">
      <h3>Schnelllinks</h3>
      <div class="quick-links-grid">
        <a href="tools/audacity.html" class="quick-link">Audacity</a>
        <a href="tools/suno.html" class="quick-link">Suno AI</a>
        <a href="tools/elevenlabs.html" class="quick-link">Stimmen-KI</a>
        <a href="tools/daw.html" class="quick-link">DAW Guide</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" style="padding: 24px; text-align: center; border-top: 1px solid var(--border-subtle);">
    <p style="color: var(--text-muted); font-size: 0.9rem;">
      © 2026 Pansonic Lab | <a href="../pages/impressum.html" style="color: var(--text-secondary);">Impressum</a>
    </p>
  </footer>

  <script>
    // Theme support
    const savedTheme = localStorage.getItem('sonicLabTheme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
