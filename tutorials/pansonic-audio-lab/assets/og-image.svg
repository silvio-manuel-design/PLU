<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff5a5a"/>
      <stop offset="100%" style="stop-color:#4ecdc4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#ff5a5a" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#4ecdc4" opacity="0.1"/>
  
  <!-- Logo Icon -->
  <g transform="translate(540, 180)" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
    <path d="M30 60V15l40-6v40"/>
    <circle cx="15" cy="60" r="10"/>
    <circle cx="55" cy="54" r="10"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">
    PANSONIC LAB
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="28" fill="#a0a0a0" text-anchor="middle">
    Audio-Produktion für Einsteiger
  </text>
  
  <!-- Tagline -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="20" fill="#4ecdc4" text-anchor="middle">
    Mit Audacity &amp; KI-Tools zu deinem eigenen Sound
  </text>
  
  <!-- Bottom accent line -->
  <rect x="400" y="480" width="400" height="4" fill="url(#accent)" rx="2"/>
</svg>