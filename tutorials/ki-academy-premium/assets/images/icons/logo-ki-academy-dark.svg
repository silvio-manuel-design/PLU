<!-- PLU Logo – Sage/Green Premium Version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pluGradientPremium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#90A955"/>
      <stop offset="100%" stop-color="#B8C96E"/>
    </linearGradient>
    <linearGradient id="pluGradientAltPremium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#B8C96E"/>
      <stop offset="100%" stop-color="#90A955"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46"
          fill="none" stroke="url(#pluGradientPremium)" stroke-width="3" opacity="0.95"/>

  <circle cx="50" cy="50" r="32"
          fill="none" stroke="#90A955" stroke-width="4" opacity="0.95"/>

  <path d="M38 28 L38 72 M38 28 L58 28 C68 28 68 46 58 46 L38 46"
        fill="none" stroke="url(#pluGradientAltPremium)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <circle cx="78" cy="30" r="5" fill="#90A955"/>
</svg>
