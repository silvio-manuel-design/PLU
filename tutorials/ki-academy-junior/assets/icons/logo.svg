<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <!-- Logo Text: KI ACADEMY -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#9d4edd"/>
    </linearGradient>
  </defs>
  
  <!-- Robot Icon -->
  <g transform="translate(10, 10)">
    <!-- Head -->
    <rect x="0" y="5" width="30" height="25" rx="8" fill="none" stroke="#00d4aa" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="8" cy="15" r="3" fill="#00d4aa"/>
    <circle cx="22" cy="15" r="3" fill="#00d4aa"/>
    <!-- Antenna -->
    <line x1="15" y1="5" x2="15" y2="0" stroke="#00d4aa" stroke-width="2"/>
    <circle cx="15" cy="0" r="2.5" fill="#9d4edd"/>
    <!-- Mouth -->
    <rect x="8" y="22" width="14" height="4" rx="2" fill="#00d4aa"/>
  </g>
  
  <!-- Text KI -->
  <text x="55" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#textGradient)">KI</text>
  
  <!-- Text ACADEMY -->
  <text x="90" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">ACADEMY</text>
</svg>