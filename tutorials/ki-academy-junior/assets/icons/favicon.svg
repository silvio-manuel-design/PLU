<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  
  <!-- Robot Face -->
  <g transform="translate(50, 50)">
    <!-- Head outline -->
    <rect x="-30" y="-25" width="60" height="50" rx="15" fill="#1a1a24" stroke="#00d4aa" stroke-width="3"/>
    
    <!-- Eyes -->
    <circle cx="-12" cy="-5" r="8" fill="#00d4aa"/>
    <circle cx="12" cy="-5" r="8" fill="#00d4aa"/>
    
    <!-- Eye pupils -->
    <circle cx="-12" cy="-5" r="3" fill="#0a0a0f"/>
    <circle cx="12" cy="-5" r="3" fill="#0a0a0f"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-25" x2="0" y2="-40" stroke="#00d4aa" stroke-width="3"/>
    <circle cx="0" cy="-42" r="5" fill="#9d4edd"/>
    
    <!-- Mouth -->
    <rect x="-10" y="15" width="20" height="6" rx="3" fill="#00d4aa"/>
  </g>
</svg>