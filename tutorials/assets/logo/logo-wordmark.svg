<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Pantam, Art & Culture - Logo mit Wortmarke -->
  
  <!-- Symbol (links) -->
  <g transform="translate(20, 10)">
    <!-- Outer Ring -->
    <circle cx="30" cy="30" r="26" fill="none" stroke="#e8eef1" stroke-width="2.5"/>
    <!-- Inner Ring -->
    <circle cx="30" cy="30" r="20" fill="none" stroke="#7d8590" stroke-width="1"/>
    <!-- Central Node -->
    <circle cx="30" cy="30" r="5" fill="#27ae60"/>
    <!-- Directional pulse -->
    <path d="M30 15 L30 22" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 19 L30 15 L35 19" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Connection points -->
    <circle cx="30" cy="6" r="2.5" fill="#e8eef1"/>
    <circle cx="54" cy="30" r="2" fill="#7d8590"/>
    <circle cx="30" cy="54" r="2" fill="#7d8590"/>
    <circle cx="6" cy="30" r="2" fill="#7d8590"/>
    <!-- P Initial -->
    <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="8" font-weight="700" fill="#e8eef1" text-anchor="middle">P</text>
  </g>
  
  <!-- Wordmark (rechts) -->
  <text x="85" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" font-weight="600" fill="#e8eef1" letter-spacing="0.5">Pantam</text>
  <text x="85" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="14" font-weight="400" fill="#7d8590" letter-spacing="1">Art &amp; Culture</text>
</svg>
