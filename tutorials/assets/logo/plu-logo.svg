<!-- PLU v3.0 – Brand Logo (Gradient Petrol -> Cyan) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="PLU">
  <defs>
    <!-- Diagonaler Verlauf: Brand-Petrol (#0A6B75) -> Brand-Cyan (#00B6D6) -->
    <linearGradient id="pluGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A6B75"/>
      <stop offset="100%" stop-color="#00B6D6"/>
    </linearGradient>
    <!-- Alternativverlauf (horizontal), falls benötigt -->
    <linearGradient id="pluGradientAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00B6D6"/>
      <stop offset="100%" stop-color="#0A6B75"/>
    </linearGradient>
    <!-- Optional: Dark-Mode-Feintuning direkt im SVG -->
    <style>
      @media (prefers-color-scheme: dark) {
        .plu-primary { stroke: #00B6D6; }  /* heller Akzent im Dark */
        .plu-dot     { fill:   #00B6D6; }
      }
    </style>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46"
          fill="none" stroke="url(#pluGradient)" stroke-width="3" opacity="0.95"/>

  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="32"
          fill="none" stroke="#0A6B75" stroke-width="4" opacity="0.95" class="plu-primary"/>

  <!-- Stylized 'P' (Markenkern) -->
  <path d="M38 28 L38 72 M38 28 L58 28 C68 28 68 46 58 46 L38 46"
        fill="none" stroke="url(#pluGradientAlt)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbital Dot -->
  <circle cx="78" cy="30" r="5" fill="#00B6D6" class="plu-dot"/>
</svg>