<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANTAM LEARNING UNIVERSE</title>
  <meta name="description" content="PANTAM Learning Universe - Training für Web, Media & Technology. Mit KI denken. Menschlich handeln.">
  <link rel="icon" type="image/svg+xml" href="/tutorials/assets/logo/favicon/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #21262d 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    /* Logo Animation */
    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
    }

    .logo {
      width: 100%;
      height: 100%;
      animation: pulse 2s ease-in-out infinite, float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(88, 166, 255, 0.3));
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.2) 0%, transparent 70%);
      animation: glow 2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Text Styles */
    .brand-name {
      font-size: 2.5rem;
      font-weight: 800;
      color: #e8eef1;
      letter-spacing: 2px;
      margin-bottom: 16px;
      opacity: 0;
      animation: slideUp 0.8s ease-out 0.3s forwards;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .brand-name span {
      color: #58a6ff;
    }

    .tagline {
      font-size: 1.25rem;
      color: #8b949e;
      font-weight: 300;
      opacity: 0;
      animation: slideUp 0.8s ease-out 0.6s forwards;
      margin-bottom: 48px;
    }

    .tagline-de {
      display: block;
      margin-bottom: 8px;
    }

    .tagline-en {
      display: block;
      font-size: 1rem;
      color: #6e7681;
      font-style: italic;
    }

    /* Loading Indicator */
    .loading {
      display: flex;
      gap: 8px;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1s forwards;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #58a6ff;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    .loading-text {
      margin-top: 16px;
      font-size: 0.875rem;
      color: #6e7681;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.2s forwards;
    }

    /* Direct Link */
    .direct-link {
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.5s forwards;
    }

    .direct-link a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .direct-link a:hover {
      color: #79b8ff;
      text-decoration: underline;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(88, 166, 255, 0.3);
      border-radius: 50%;
      animation: float-particle 15s infinite;
    }

    @keyframes float-particle {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .logo-wrapper {
        width: 80px;
        height: 80px;
      }

      .brand-name {
        font-size: 1.75rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .tagline-en {
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body>
  <!-- Background Particles -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <!-- Logo mit Glow -->
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Ring -->
        <circle cx="50" cy="50" r="40" fill="none" stroke="#e8eef1" stroke-width="3"/>
        <!-- Impuls-Pfeil -->
        <path d="M50 10 L50 25 M50 10 L45 18 M50 10 L55 18" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Mittelpunkt -->
        <circle cx="50" cy="50" r="8" fill="#58a6ff"/>
      </svg>
    </div>

    <!-- Brand Name -->
    <h1 class="brand-name">PANTAM <span>LEARNING</span> UNIVERSE</h1>

    <!-- Slogan bilingual -->
    <p class="tagline">
      <span class="tagline-de">„Mit KI denken. Menschlich handeln."</span>
      <span class="tagline-en">"Learn to think with AI. Act human."</span>
    </p>

    <!-- Loading Animation -->
    <div class="loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <p class="loading-text">Lade Lernumgebung...</p>

    <!-- Direct Link (falls Weiterleitung nicht funktioniert) -->
    <div class="direct-link">
      <a href="/tutorials/">Klicke hier, wenn nichts passiert →</a>
    </div>
  </div>

  <script>
    // Generate random particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (10 + Math.random() * 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // Progressive Enhancement: Auto-redirect after 2.5 seconds
    // This avoids the <meta refresh> accessibility warning
    setTimeout(function() {
      window.location.href = '/tutorials/';
    }, 2500);
  </script>
</body>
</html>
